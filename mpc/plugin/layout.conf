# The Torpedo's MPC skin: Simulation pages, one tab per area, one outlined Q-Link group per panel (every 4 keys of a
# qlinks line are one group; MPC's Q-Link button steps through them). Dracula palette. Edited in the skin studio
# (mpc-vst-plugins/tools/studio.py serve plugin/layout.conf --params plugin/params.json), not generated;
# gen_plugin.py --check keeps it in line with params.json. The PRESET tab works in every mode; the editing
# tabs show a placeholder in arcade and IR for now.
