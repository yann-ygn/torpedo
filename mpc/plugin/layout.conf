# The Torpedo's MPC skin: one tab per area, one outlined Q-Link group per panel (every 4 keys of a qlinks line are
# one group; MPC's Q-Link button steps through them). Dracula palette. Edited in the skin studio
# (mpc-vst-plugins/tools/studio.py serve plugin/layout.conf --params plugin/params.json), not generated;
# gen_plugin.py --check keeps it in line with params.json.
# A tab's Q-Links can't follow the preset's mode, so a mode with other controls has its own tab: PRESET (every mode),
# ARCADE, AMP and EQ (simulation and IR; in arcade, what arcade sets, read only), CAB (simulation; read only in arcade
# but for its cab and mic A) and IR. The engine drops writes to what the mode doesn't show (Q-Links left on it).
# Mute toggles are the stock pill with a red thumb when on (images/mute_*.svg, 37 px tall like its touch box).
style=td3
theme_bg=282a36
theme_panel=21222c
theme_line=44475a
theme_ink=f8f8f2
